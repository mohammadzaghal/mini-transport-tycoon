stages:
  - lint
  - test

default:
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  SDL_VIDEODRIVER: "dummy"
  SDL_AUDIODRIVER: "dummy"

.install_python_deps: &install_python_deps
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt
  - pip install pytest pytest-cov flake8

.install_sdl_deps: &install_sdl_deps
  - apt-get update -qq
  - apt-get install -y --no-install-recommends
      libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0
      libfreetype6 libportmidi0

lint:
  stage: lint
  script:
    - *install_python_deps
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - flake8 . --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics
    - python -m compileall -q main.py src tests

test:
  stage: test
  script:
    - *install_sdl_deps
    - *install_python_deps
    - pytest -q
        --cov=src
        --cov-report=term
        --cov-report=xml:coverage.xml
        --cov-report=html:htmlcov
        --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - report.xml
      - coverage.xml
      - htmlcov/
    expire_in: 1 week

test:frontend-coverage:
  stage: test
  script:
    - *install_sdl_deps
    - *install_python_deps
    - pytest tests/frontend -q
        --cov=src
        --cov-report=term
        --cov-report=html:htmlcov-frontend
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    when: always
    paths:
      - htmlcov-frontend/
    expire_in: 1 week
  allow_failure: true